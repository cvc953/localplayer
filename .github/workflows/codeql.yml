name: CodeQL

# El ruleset de master exige resultados de code scanning. Sin este workflow el check nunca
# aparece y ningún pull request puede mergearse. Corre en cada PR para no dejar PRs sin
# análisis: un filtro de rutas haría que un PR sólo de docs quede bloqueado para siempre.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Lunes 04:00 UTC: mantiene el baseline de master fresco.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Kotlin no soporta build-mode: none, así que CodeQL necesita una compilación real.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build for analysis
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
