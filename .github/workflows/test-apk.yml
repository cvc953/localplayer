name: Android Test APK

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Nombre opcional para identificar el APK de prueba"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build test release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" ]]; then
            echo "::error::Signing keystore secret is missing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          ANDROID_SIGNING_STORE_FILE: release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_SIGNING_STORE_PASSWORD" || -z "$ANDROID_SIGNING_KEY_ALIAS" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are incomplete."
            exit 1
          fi
          ./gradlew assembleRelease

      - name: Collect APK and checksum
        env:
          TEST_VERSION: ${{ inputs.version || format('run-{0}', github.run_number) }}
        run: |
          mkdir -p test-apk
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::No signed APK found in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_PATH" "test-apk/LocalPlayer-${TEST_VERSION}.apk"
          (cd test-apk && sha256sum "LocalPlayer-${TEST_VERSION}.apk" > checksums.txt)

      - name: Smoke test release APK
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            capture_diagnostics() {
              adb logcat -d > test-apk/logcat.txt 2>&1 || true
              adb shell getprop > test-apk/getprop.txt 2>&1 || true
              adb shell dumpsys activity processes > test-apk/activity.txt 2>&1 || true
            }
            trap capture_diagnostics EXIT

            adb wait-for-device
            adb install -r "test-apk/LocalPlayer-${{ inputs.version || format('run-{0}', github.run_number) }}.apk" > test-apk/install.txt 2>&1
            adb logcat -c
            adb shell am start -n com.cvc953.localplayer/.MainActivity > test-apk/launch.txt 2>&1
            sleep 5
            if ! adb shell pidof com.cvc953.localplayer >/dev/null; then
              echo "::error::Release APK process exited after launch."
              printf 'FAIL\n' > test-apk/smoke-status.txt
              exit 1
            fi
            printf 'PASS\n' > test-apk/smoke-status.txt 

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localplayer-test-apk-${{ github.run_number }}
          path: |
            test-apk/*.apk
            test-apk/checksums.txt
            test-apk/logcat.txt
            test-apk/getprop.txt
            test-apk/activity.txt
            test-apk/install.txt
            test-apk/launch.txt
            test-apk/smoke-status.txt
            test-apk/r8
          if-no-files-found: warn
          retention-days: 7
