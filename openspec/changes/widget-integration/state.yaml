# Why this change is obsolete (2026-10-23)
# The Glance migration never completed. Phases 4.3, 4.4, 6.2, 7.5 and 7.6 remain
# unresolved because `provideContent` / `GlanceAppWidgetManager` could not be driven
# from `provideGlance`. The live widget instead renders with classic
# `android.widget.RemoteViews` (PlayerWidget.kt) via `AppWidgetProvider`
# (PlayerWidgetReceiver / PlayerWidgetSquareReceiver), and it works.
#
# The Glance dependency scaffolding was removed as dead code: androidx.glance,
# androidx.work, androidx.room and androidx.datastore were the ONLY sources of
# ACCESS_NETWORK_STATE, WAKE_LOCK and RECEIVE_BOOT_COMPLETED in the merged manifest.
# Those dependencies are gone from build.gradle.kts and libs.versions.toml, and
# PlayerWidgetActions.kt plus PlayerWidgetActionsTest.kt were deleted.
#
# Treat every Glance API assumption recorded in these artifacts as NOT applied.
# Resuming requires re-adding the dependencies first; nothing here is a statement
# about the current code.
